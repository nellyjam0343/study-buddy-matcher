<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Study Buddy — Sign up</title>
  <meta name="theme-color" content="#ff5a4d" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <img class="logo" src="/icon.svg" alt="" />
      <div>
        <h1>Study Buddy</h1>
        <p class="sub">Answer a few questions. Get matched. Say hi.</p>
      </div>
    </div>

    <form id="signup" class="card">
      <h2>Tell us about you</h2>
      <p class="hint">We use this to find you a good study partner.</p>

      <!-- SIGN-ON + PROFILE: name, email, age. Age powers the safety age-gate. -->
      <label class="field">
        <span>Your name</span>
        <input type="text" id="name" required autocomplete="name" placeholder="Alex Rivera" />
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" required autocomplete="email" placeholder="alex@school.edu" />
      </label>
      <label class="field">
        <span>Age <span class="sub">(used for the safety age-gate)</span></span>
        <input type="number" id="age" required min="10" max="120" placeholder="19" />
      </label>

      <!-- The survey questions render here, straight from questions.js -->
      <div id="questions"></div>

      <p id="error" class="small" style="color:var(--accent)"></p>
      <button type="submit" id="submit" class="block">Find my study buddy →</button>
    </form>

    <p class="nav center"><a href="/organizer.html">Organizer view →</a></p>
  </div>

  <script src="/app.js"></script>
  <script src="/questions.js"></script>
  <script>
    // ----- Render the survey from questions.js (handles the 3 question kinds) -----
    const qRoot = document.getElementById("questions");

    function fieldFor(q) {
      // Build one question's HTML. "branch" follow-ups reuse this same function.
      if (q.type === "text") {
        return `<label class="field"><span>${q.label}</span>
                  <input type="text" data-qid="${q.id}" /></label>`;
      }
      if (q.type === "select") {
        const opts = q.options.map((o) => `<option value="${o}">${o}</option>`).join("");
        // data-branch marks selects that reveal a follow-up question.
        const isBranch = q.branch ? `data-branch="${q.id}"` : "";
        return `<label class="field"><span>${q.label}</span>
                  <select data-qid="${q.id}" ${isBranch}>
                    <option value="" disabled selected>Choose…</option>${opts}
                  </select></label>
                <div id="branch-${q.id}"></div>`;
      }
      if (q.type === "multi") {
        const rows = q.options.map((o) =>
          `<label class="choice"><input type="checkbox" data-qid="${q.id}" value="${o}" /> ${o}</label>`
        ).join("");
        return `<label class="field"><span>${q.label}</span>
                  <div class="choices">${rows}</div></label>`;
      }
      return "";
    }

    // Draw the base questions.
    qRoot.innerHTML = window.QUESTIONS.map(fieldFor).join("");

    // BRANCHING: when a branch-select changes, show the matching follow-up(s).
    qRoot.addEventListener("change", (e) => {
      const sel = e.target;
      if (!sel.dataset.branch) return;
      const q = window.QUESTIONS.find((x) => x.id === sel.dataset.branch);
      const slot = document.getElementById("branch-" + q.id);
      const followUps = (q.branch && q.branch[sel.value]) || [];
      slot.innerHTML = followUps.map(fieldFor).join("");
    });

    // ----- Collect every visible answer into one object -----
    function collectAnswers() {
      const answers = {};
      // text + select answers
      qRoot.querySelectorAll("input[data-qid], select[data-qid]").forEach((el) => {
        if (el.type === "checkbox") return; // handled below
        if (el.value) answers[el.dataset.qid] = el.value;
      });
      // multi-select answers become arrays
      qRoot.querySelectorAll("input[type=checkbox][data-qid]").forEach((cb) => {
        if (!cb.checked) return;
        (answers[cb.dataset.qid] = answers[cb.dataset.qid] || []).push(cb.value);
      });
      return answers;
    }

    // ----- Submit: create the profile, then go to the result screen -----
    document.getElementById("signup").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit");
      const err = document.getElementById("error");
      err.textContent = "";
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        const profile = await api("/api/signup", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            age: Number(document.getElementById("age").value),
            answers: collectAnswers(),
          }),
        });
        store.profileId = profile.id;
        store.name = profile.name;
        location.href = "/result.html";
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false; btn.textContent = "Find my study buddy →";
      }
    });
  </script>
</body>
</html>
